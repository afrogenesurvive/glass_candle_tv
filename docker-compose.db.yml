# =============================================================================
# black_glass_candle — optional PostgreSQL overlay
#
# ONLY use this if DB_TYPE=pgsql in .env. For one user, SQLite is simpler,
# faster, and has no separate service to back up. This exists because the
# upstream project documents it, not because you need it.
#
#   docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
#
# Switching to Postgres after the fact means migrating the database. Do it at
# setup time or not at all.
# =============================================================================

name: black_glass_candle

services:
  freshrss:
    environment:
      # Merged with the base file. Postgres needs the --db-* flags, and they are
      # only read on first run, when freshrss_data is empty.
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${BASE_URL}
        --db-base ${DB_BASE}
        --db-host freshrss-db
        --db-password ${DB_PASSWORD}
        --db-type pgsql
        --db-user ${DB_USER}
        --default-user ${ADMIN_USER:-admin}
        --language ${FRESHRSS_LANGUAGE:-en}
    depends_on:
      freshrss-db:
        condition: service_healthy

  freshrss-db:
    image: postgres:16-alpine
    container_name: bgc-freshrss-db
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - freshrss_db_data:/var/lib/postgresql/data

    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${DB_BASE}
      POSTGRES_USER: ${DB_USER}
      # NOTE: no default. An empty password here fails loudly rather than
      # silently creating a passwordless database.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set when using the Postgres overlay}

    # No ports published. FreshRSS reaches this over the internal compose
    # network by service name; the host never needs to talk to it directly.
    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_BASE}"]
      timeout: 5s
      start_period: 20s
      interval: 30s
      retries: 5

volumes:
  freshrss_db_data:
    name: black_glass_candle_freshrss_db_data
