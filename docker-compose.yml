# =============================================================================
# black_glass_candle — container stack
#
#   cp .env.example .env      # then fill it in
#   docker compose up -d
#   docker compose ps         # both should reach (healthy)
#
# Everything is driven from .env. This file should not need editing.
# =============================================================================

# NOTE: deliberately no `version:` key — it is obsolete in Compose v2 and emits
# a warning on every single command.

name: black_glass_candle

services:
  # ---------------------------------------------------------------------------
  # FreshRSS — storage, scheduling, filtering, API
  # ---------------------------------------------------------------------------
  freshrss:
    image: freshrss/freshrss:latest
    container_name: bgc-freshrss
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        # Without a cap these grow without limit and will eventually fill the disk.
        max-size: "10m"
        max-file: "3"

    ports:
      # Bound to $BIND_ADDR, NOT 0.0.0.0. The default (127.0.0.1) means the login
      # page is unreachable from café/hotel networks.
      - "${BIND_ADDR:-127.0.0.1}:${FRESHRSS_PORT:-8080}:80"

    volumes:
      # Persistent feed database, user config, cached articles.
      - freshrss_data:/var/www/FreshRSS/data
      # Third-party extensions (Youlag). Bind-mounted so installs are reproducible
      # and survive `docker compose down -v`.
      - ./freshrss-extensions:/var/www/FreshRSS/extensions

    environment:
      TZ: ${TZ:-UTC}

      # REQUIRED. Omitting this disables the built-in cron daemon entirely and
      # feeds never refresh — the instance still looks healthy while going stale.
      CRON_MIN: ${CRON_MIN:-13,43}

      # FreshRSS blocks requests to internal hosts by default. Without this the
      # container cannot fetch feeds served by the rss-bridge container.
      INTERNAL_HOST_ALLOWLIST: ${INTERNAL_HOST_ALLOWLIST:-rss-bridge:80}

      FRESHRSS_ENV: production

      # --- FIRST RUN ONLY -----------------------------------------------------
      # These are consumed exactly once, when freshrss_data is empty.
      # Editing them later has NO EFFECT. To change them you must run
      # `docker compose down -v`, which deletes every subscription.
      # Change values in the web UI instead.
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${BASE_URL}
        --default-user ${ADMIN_USER:-admin}
        --language ${FRESHRSS_LANGUAGE:-en}
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD}
        --email ${ADMIN_EMAIL}
        --language ${FRESHRSS_LANGUAGE:-en}
        --password ${ADMIN_PASSWORD}
        --user ${ADMIN_USER:-admin}

    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3

    depends_on:
      - rss-bridge

  # ---------------------------------------------------------------------------
  # RSS-Bridge — generates feeds for sites that have none
  # ---------------------------------------------------------------------------
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: bgc-rss-bridge
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "${BIND_ADDR:-127.0.0.1}:${RSSBRIDGE_PORT:-3000}:80"

    volumes:
      # Holds config.ini.php (token auth + bridge allowlist) and any custom
      # bridges. Generated by scripts/gen-rssbridge-config.sh from .env.
      - ./rss-bridge-config:/config

    environment:
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      timeout: 5s
      start_period: 20s
      interval: 60s
      retries: 3

volumes:
  freshrss_data:
    name: black_glass_candle_freshrss_data
